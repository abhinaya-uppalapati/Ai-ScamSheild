# Spins up all four services together for local development or a
# single-VM deployment. Requires a .env file in backend/ and ai-service/
# (copy from their .env.example files) before running:
#
#   docker compose up --build
#
# Frontend: http://localhost:5173
# Backend:  http://localhost:5000
# AI:       http://localhost:8000
# Mongo:    localhost:27017 (persisted in the mongo_data volume)

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  ai-service:
    build: ./ai-service
    restart: unless-stopped
    env_file:
      - ./ai-service/.env
    ports:
      - "8000:8000"

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - MONGO_URI=mongodb://mongo:27017/scamshield
      - AI_SERVICE_URL=http://ai-service:8000
    depends_on:
      - mongo
      - ai-service
    ports:
      - "5000:5000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  mongo_data:
