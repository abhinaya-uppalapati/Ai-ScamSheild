# Render Blueprint — deploys the backend and AI service together.
# In the Render dashboard: New > Blueprint > point at this repo.
# You will still need to set MONGO_URI, JWT_SECRET, and ANTHROPIC_API_KEY
# as secret environment variables in the Render dashboard (do not commit
# real secrets into this file).

services:
  - type: web
    name: ai-scamshield-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node src/server.js
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: AI_SERVICE_URL
        fromService:
          name: ai-scamshield-ai-service
          type: web
          property: hostport
      - key: CLIENT_URL
        sync: false

  - type: web
    name: ai-scamshield-ai-service
    runtime: python
    rootDir: ai-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
